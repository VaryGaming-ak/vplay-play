<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vplay Games</title>
<style>
body{margin:0;padding:0;background:#fff8e8;color:#141414;font-family:sans-serif;font-size:12px}
a{color:#1c3e9c;text-decoration:none;font-weight:bold}
.r{float:right}
.hd{background:#101a3a;color:#fff;font-weight:bold;padding:4px 5px;font-size:13px}
.hd .r{color:#ffd23c;font-size:11px}
.lg{background:#ffd23c;color:#101a3a;padding:0 3px}
.kt{line-height:0;font-size:0;background:#101a3a}
.cont{display:block;background:#1e8a3c;color:#fff;padding:5px 6px}
.pick{background:#fff;padding:6px;border-bottom:3px solid #ffd23c;overflow:hidden}
.pi{float:left;margin-right:7px}
.pt b{font-size:14px;color:#101a3a}
.lab{background:#e03c32;color:#fff;font-size:9px;font-weight:bold;padding:0 3px}
.d{color:#5a5f6b;font-weight:normal;font-size:10px}
.play{display:block;clear:both;background:#ffd23c;color:#101a3a;border:1px solid #c99a12;text-align:center;padding:5px;margin-top:5px;font-size:13px}
.big{margin:4px 6px;padding:7px;font-size:15px}
.sec{background:#101a3a;color:#ffd23c;font-weight:bold;font-size:11px;padding:3px 6px}
.row{display:block;background:#fff;border-bottom:1px solid #eadfca;border-left:5px solid #e03c32;padding:4px 5px;overflow:hidden}
.ic{float:left;margin-right:6px;line-height:0}
.tx b{font-size:13px}
.tag{color:#fff;font-size:9px;font-weight:bold;padding:0 3px}
.tags{padding:2px 6px 4px;background:#fff}
.fr{text-align:center;background:#fff;line-height:0;padding:2px 0}
.p{padding:4px 6px;background:#fff}
.hl{padding:3px 6px;border-bottom:1px solid #eadfca;background:#fff;font-size:11px}
.hl b{color:#e03c32}
.ev{background:#1e8a3c;color:#fff;font-weight:bold;padding:3px 5px;font-size:11px}
.ev .r{color:#ffd23c}
.ev0{background:#101a3a}
.evl{background:#e03c32}
.q{padding:4px 6px;font-weight:bold;color:#101a3a;background:#fff}
.ans{display:block;margin:3px 5px;padding:5px 6px;background:#1c3e9c;color:#fff;border:1px solid #101a3a;font-size:12px}
.inf{color:#4a4f58;padding:3px 6px;font-size:10px;text-align:center}
.ad{margin:6px;padding:14px 2px;border:1px solid #c9b98a;color:#8a7a5a;text-align:center;background:#fffdf5;font-size:10px}
.tip{background:#e6f6f5;color:#126a66;padding:4px 6px;font-size:10px}
.ft{padding:5px 6px;font-size:10px;color:#4a4f58}
.sb{text-align:center;background:#fff;padding:4px 0}
.bg{font-size:22px;font-weight:bold;color:#101a3a}
.nb{background:#1e8a3c;color:#fff;padding:0 4px;font-weight:bold}
/* Small screens (Nokia 105/110 4G, about 120 pixels wide) */
.sm{font-size:11px}
.sm .hd{font-size:12px;padding:3px 4px}
.sm .pick{padding:4px}
.sm .pi{margin-right:4px}
.sm .pt b{font-size:12px}
.sm .play{font-size:11px;padding:4px}
.sm .big{font-size:12px;padding:5px;margin:3px 4px}
.sm .row{padding:3px;border-left-width:4px}
.sm .ic{margin-right:4px}
.sm .tx b{font-size:11px}
.sm .ans{margin:2px 3px;padding:4px;font-size:11px}
.sm .q{padding:3px 4px}
/* Computers only: show the site inside a 240x320 phone frame. Old engines
   such as Opera Mini's servers don't know "pointer" and skip this. */
@media screen and (min-width: 600px) and (pointer: fine) {
html{background:#1b1f27;padding:12px 0}
body{width:240px;min-height:320px;margin:0 auto;zoom:2;border:5px solid #2b303b}
}
</style>
</head>
<body>
<noscript><p>Scripts are switched off, so the games can't load.</p></noscript>
<script src="app.js?v=4"></script>
<script>V.main();</script>
</body>
</html>
